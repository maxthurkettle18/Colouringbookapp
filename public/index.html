<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Colouring Book Generator</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <h1>🎨 Colouring Book Generator</h1>
      <p class="sub">Generate original line-art pages guided by your style &amp; theme references.</p>
      <div id="status" class="status"></div>
    </header>

    <main>
      <form id="form" class="card">
        <label>
          Book title
          <input name="title" type="text" value="My Colouring Book" />
        </label>

        <label>
          Theme <span class="req">*</span>
          <input name="theme" type="text" placeholder="e.g. friendly jungle animals" required />
        </label>

        <label>
          Style guidelines (optional)
          <textarea name="style" rows="3" placeholder="e.g. bold rounded outlines, cute kawaii faces, lots of open space for young children"></textarea>
        </label>

        <div class="row">
          <label>
            Pages
            <input name="count" type="number" min="1" max="40" value="28" />
          </label>
          <label>
            Detail level
            <select name="complexity">
              <option value="simple">Simple (young children)</option>
              <option value="medium" selected>Medium</option>
              <option value="detailed">Detailed (adults)</option>
            </select>
          </label>
        </div>

        <label>
          Image quality (affects cost per page)
          <select name="quality">
            <option value="low" selected>Draft — lowest cost (~$0.01/page)</option>
            <option value="medium">Medium (~$0.04/page)</option>
            <option value="high">High (~$0.17/page)</option>
          </select>
        </label>

        <label>
          Reference images (optional, up to 6) — used for style/theme inspiration
          <input name="references" type="file" accept="image/*" multiple />
        </label>

        <button type="submit" id="go">Preview style (1 page)</button>
        <p class="hint">Generates a single draft page first so you can approve the style before spending on the full book.</p>
      </form>

      <!-- Step 2: approve the draft style -->
      <section id="preview" class="results hidden">
        <h2>Style draft</h2>
        <p id="previewMeta" class="meta"></p>
        <div class="preview-wrap">
          <div class="tile preview-tile">
            <img id="previewImg" alt="style draft" />
            <div id="previewCap" class="cap"></div>
          </div>
          <div class="approve-actions">
            <button id="approve" type="button">✓ Approve &amp; generate all pages</button>
            <button id="retry" type="button" class="ghost">↻ Try a different draft</button>
          </div>
        </div>
      </section>

      <!-- Step 3: progress -->
      <section id="progress" class="results hidden">
        <h2>Generating your book…</h2>
        <div class="bar"><div id="barFill" class="bar-fill"></div></div>
        <p id="progressLabel" class="meta"></p>
      </section>

      <!-- Step 4: results -->
      <section id="results" class="results hidden">
        <div class="results-head">
          <h2>Your designs</h2>
          <a id="pdf" class="pdf-btn" href="#" target="_blank">⬇ Download PDF</a>
        </div>
        <p id="meta" class="meta"></p>
        <div id="grid" class="grid"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
